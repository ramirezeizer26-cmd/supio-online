
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>sup.io</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101522;color:#fff;font-family:Arial,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#26334c,#101522);z-index:5}
.panel{width:min(92vw,390px);padding:28px;background:#171e2c;border:1px solid #3b4b66;border-radius:20px;box-shadow:0 20px 70px #0008;text-align:center}
h1{font-size:42px;margin:0 0 8px;color:#7de5b0}
p{color:#b9c4d6}
input,button{font:inherit;border:0;border-radius:10px;padding:13px;margin:7px 0;width:100%}
input{background:#0e1420;color:white;border:1px solid #39475d}
button{background:#62d99a;color:#102019;font-weight:bold;cursor:pointer}
button.secondary{background:#334158;color:white}
#hud{position:fixed;inset:0;pointer-events:none}
.box{position:absolute;background:#101722c9;border:1px solid #334158;border-radius:12px;padding:10px;font-size:14px}
#leader{right:12px;top:12px;min-width:155px}
#instructions{left:12px;top:12px;pointer-events:auto;cursor:pointer}
#chat{left:12px;bottom:12px;width:min(320px,50vw);pointer-events:auto}
#chatlog{height:110px;overflow:auto;font-size:13px;overflow-wrap:anywhere}
#chatform{display:flex;gap:5px}
#chatform input{margin:4px 0;padding:8px}
#chatform button{width:70px;margin:4px 0;padding:8px}
#notice{position:absolute;top:20%;left:50%;transform:translateX(-50%);background:#101722e8;padding:10px 16px;border-radius:12px;display:none}
#mobile{position:fixed;right:12px;bottom:14px;width:130px;display:flex;flex-direction:column;gap:8px;pointer-events:auto}
#mobile button{margin:0;padding:12px;font-size:13px}
#help{display:none;position:absolute;left:12px;top:55px;max-width:280px;pointer-events:auto}
@media(min-width:800px){#mobile{width:150px}}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="menu">
 <div class="panel">
  <h1>sup.io</h1>
  <p>Online multiplayer circle arena</p>
  <input id="name" maxlength="18" placeholder="Username" value="Player">
  <label>Circle color <input id="color" type="color" value="#55cc88"></label>
  <button id="play">PLAY ONLINE</button>
  <p id="status">Enter a name to play.</p>
 </div>
</div>

<div id="hud" style="display:none">
 <div id="instructions" class="box">INSTRUCTIONS ⓘ</div>
 <div id="help" class="box">
  Move your mouse or finger to move.<br>
  Click or tap to shoot (1000 damage).<br>
  FIND PLAYER costs 1000 score and launches a tracking ball. It does not damage the opponent.
 </div>
 <div id="leader" class="box">
  <b>TOP PLAYERS</b>
  <div id="leaderlist"></div>
 </div>
 <div id="chat" class="box">
  <div><b>ONLINE CHAT</b></div>
  <div id="chatlog"></div>
  <form id="chatform">
   <input id="chatinput" maxlength="120" placeholder="Say something...">
   <button>SEND</button>
  </form>
 </div>
 <div id="notice"></div>
</div>

<div id="mobile" style="display:none">
 <button id="shootBtn">SHOOT</button>
 <button id="findBtn">FIND PLAYER (-1000)</button>
 <button id="fullBtn" class="secondary">FULLSCREEN</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const menu=document.getElementById("menu");
const hud=document.getElementById("hud");
const statusEl=document.getElementById("status");
const leaderlist=document.getElementById("leaderlist");
const chatlog=document.getElementById("chatlog");
const noticeEl=document.getElementById("notice");

let socket=null;
let connected=false;
let joined=false;
let myId=null;
let worldSize=6000;

let players=[];
let food=[];
let pellets=[];
let findBalls=[];

let mouse={x:innerWidth/2,y:innerHeight/2};
let me=null;
let noticeTimer=null;

function resize(){
 canvas.width=innerWidth*devicePixelRatio;
 canvas.height=innerHeight*devicePixelRatio;
 canvas.style.width=innerWidth+"px";
 canvas.style.height=innerHeight+"px";
 ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}

addEventListener("resize",resize);
resize();

function send(o){
 if(socket&&socket.readyState===WebSocket.OPEN){
  socket.send(JSON.stringify(o));
 }
}

function showNotice(t){
 noticeEl.textContent=t;
 noticeEl.style.display="block";
 clearTimeout(noticeTimer);
 noticeTimer=setTimeout(()=>{
  noticeEl.style.display="none";
 },2500);
}

function getMe(){
 return players.find(p=>String(p.id)===String(myId));
}

function connect(){
 const protocol=location.protocol==="https:"?"wss:":"ws:";
 socket=new WebSocket(protocol+"//"+location.host);

 statusEl.textContent="Connecting...";

 socket.onopen=()=>{
  connected=true;
  statusEl.textContent="Connected. Joining...";
  send({
   type:"join",
   name:document.getElementById("name").value.trim()||"Player",
   color:document.getElementById("color").value
  });
 };

 socket.onmessage=e=>{
  let d;
  try{
   d=JSON.parse(e.data);
  }catch{
   return;
  }

  if(d.type==="welcome"){
   myId=d.id||d.playerId;
   worldSize=d.worldSize||6000;
   food=d.food||[];
   players=d.players||[];

   joined=true;
   menu.style.display="none";
   hud.style.display="block";
   document.getElementById("mobile").style.display="flex";

   showNotice("Welcome to sup.io!");
  }

  else if(d.type==="state"){
   players=d.players||players;
   pellets=d.pellets||[];
   findBalls=d.findBalls||[];
   me=getMe();
   updateLeaderboard();
  }

  else if(d.type==="playerJoined"){
   if(d.player&&!players.some(p=>p.id===d.player.id)){
    players.push(d.player);
   }
  }

  else if(d.type==="playerLeft"||d.type==="playerEaten"){
   const id=d.id||d.eatenId;
   players=players.filter(p=>String(p.id)!==String(id));
  }

  else if(d.type==="dotEaten"){
   food=food.filter(f=>f.id!==d.dotId);
  }

  else if(d.type==="dotRespawn"){
   if(d.dot)food.push(d.dot);
  }

  else if(d.type==="chat"){
   addChat(d.name,d.color,d.text);
  }

  else if(d.type==="notice"){
   showNotice(d.text);
  }
 };

 socket.onerror=()=>{
  statusEl.textContent="Connection error. Check the server.";
 };

 socket.onclose=()=>{
  connected=false;
  joined=false;
  statusEl.textContent="Disconnected. Refresh to reconnect.";
 };
}

document.getElementById("play").onclick=()=>{
 if(!connected&&!socket){
  connect();
 }else if(!joined){
  statusEl.textContent="Connecting to server...";
 }
};

document.getElementById("instructions").onclick=()=>{
 const h=document.getElementById("help");
 h.style.display=h.style.display==="block"?"none":"block";
};

function updateLeaderboard(){
 const top=[...players]
  .sort((a,b)=>(b.mass||0)-(a.mass||0))
  .slice(0,3);

 leaderlist.innerHTML=top.map((p,i)=>
  `${i+1}. ${escapeHtml(p.name)} — ${Math.round(p.mass||0)}`
 ).join("<br>");
}

function escapeHtml(s){
 return String(s).replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[c]));
}

function addChat(name,color,text){
 const line=document.createElement("div");
 line.innerHTML=`<b style="color:${/^#[0-9a-f]{6}$/i.test(color)?color:"#fff"}">${escapeHtml(name)}:</b> ${escapeHtml(text)}`;
 chatlog.appendChild(line);
 chatlog.scrollTop=chatlog.scrollHeight;
}

document.getElementById("chatform").onsubmit=e=>{
 e.preventDefault();
 const input=document.getElementById("chatinput");
 send({type:"chat",text:input.value});
 input.value="";
};

function aim(e){
 const r=canvas.getBoundingClientRect();
 mouse.x=e.clientX-r.left;
 mouse.y=e.clientY-r.top;
}

canvas.addEventListener("pointermove",e=>{
 aim(e);
 sendMove();
});

canvas.addEventListener("pointerdown",e=>{
 aim(e);
 if(e.pointerType==="touch"){
  sendMove();
  shoot();
 }else{
  shoot();
 }
});

function sendMove(){
 if(!joined||!me)return;

 const zoom=getZoom();
 const cam=camera();

 const wx=cam.x+(mouse.x-innerWidth/2)/zoom;
 const wy=cam.y+(mouse.y-innerHeight/2)/zoom;

 send({type:"move",x:wx,y:wy});
}

function camera(){
 return me?{x:me.x,y:me.y}:{x:worldSize/2,y:worldSize/2};
}

function getZoom(){
 if(!me)return 1;

 return Math.max(
  .25,
  Math.min(1,Math.pow(1000/Math.max(1000,me.mass),.25))
 );
}

let lastShoot=0;

function shoot(){
 if(!joined)return;

 const n=Date.now();
 if(n-lastShoot<80)return;

 lastShoot=n;
 sendMove();
 send({type:"shoot"});
}

function findPlayer(){
 if(!joined)return;

 sendMove();
 send({type:"findPlayer"});
}

document.getElementById("shootBtn").onclick=shoot;
document.getElementById("findBtn").onclick=findPlayer;

document.getElementById("fullBtn").onclick=()=>{
 if(document.documentElement.requestFullscreen){
  document.documentElement.requestFullscreen();
 }
};

addEventListener("keydown",e=>{
 if(e.code==="Space"){
  e.preventDefault();
  shoot();
 }

 if(e.key.toLowerCase()==="f"){
  findPlayer();
 }
});

function drawCircle(x,y,r,color){
 ctx.beginPath();
 ctx.arc(x,y,r,0,Math.PI*2);
 ctx.fillStyle=color;
 ctx.fill();
}

function frame(){
 requestAnimationFrame(frame);

 ctx.clearRect(0,0,innerWidth,innerHeight);

 if(!joined){
  ctx.fillStyle="#101522";
  ctx.fillRect(0,0,innerWidth,innerHeight);
  return;
 }

 me=getMe();

 const cam=camera();
 const zoom=getZoom();

 ctx.save();
 ctx.translate(innerWidth/2,innerHeight/2);
 ctx.scale(zoom,zoom);
 ctx.translate(-cam.x,-cam.y);

 // Background and grid
 ctx.fillStyle="#121a28";
 ctx.fillRect(0,0,worldSize,worldSize);

 ctx.strokeStyle="#243246";
 ctx.lineWidth=1/zoom;

 for(let x=0;x<=worldSize;x+=100){
  ctx.beginPath();
  ctx.moveTo(x,0);
  ctx.lineTo(x,worldSize);
  ctx.stroke();
 }

 for(let y=0;y<=worldSize;y+=100){
  ctx.beginPath();
  ctx.moveTo(0,y);
  ctx.lineTo(worldSize,y);
  ctx.stroke();
 }

 ctx.strokeStyle="#64758c";
 ctx.lineWidth=8/zoom;
 ctx.strokeRect(0,0,worldSize,worldSize);

 // Green food dots
 for(const f of food){
  drawCircle(f.x,f.y,5,"#64e88e");
 }

 // Shooting pellets
 for(const b of pellets){
  drawCircle(b.x,b.y,7,"#ffcf5a");
 }

 // Find Player tracking balls
 for(const b of findBalls){
  drawCircle(b.x,b.y,13,"#ff6d7e");

  ctx.strokeStyle="#ffe2e6";
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.arc(b.x,b.y,18,0,Math.PI*2);
  ctx.stroke();
 }

 // Players
 for(const p of players){
  const r=Math.sqrt(Math.max(1,p.mass)*.45);

  drawCircle(p.x,p.y,r,p.color||"#55cc88");

  ctx.strokeStyle="#ffffff55";
  ctx.lineWidth=3/zoom;
  ctx.stroke();

  ctx.fillStyle="#fff";
  ctx.font=`${Math.max(14,r*.25)}px Arial`;
  ctx.textAlign="center";
  ctx.fillText(p.name,p.x,p.y+5);

  ctx.font=`${Math.max(12,r*.18)}px Arial`;
  ctx.fillText(Math.round(p.mass),p.x,p.y+22);
 }

 ctx.restore();
}

frame();
</script>
</body>
</html>
